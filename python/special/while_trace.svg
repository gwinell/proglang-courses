<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">Шаги счётчика в цикле while</title><desc id="desc">Таблица состояний count от 1 до 4: для значений 1, 2 и 3 тело выполняется, значение увеличивается; при 4 условие становится ложным и цикл заканчивается.</desc>
<rect width="1080" height="500" rx="20" fill="#f7fafc"/>
<text x="540" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17324d">Пример: while count &lt; 4</text>
<text x="540" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#536579">Начало: count = 1 · внутри цикла: показать count, затем прибавить 1</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="45" y="130" width="180" height="220" rx="16" fill="#e4f5ec" stroke="#379669" stroke-width="3"/><text x="135" y="170" font-size="19" font-weight="700" fill="#194d35">Проверка 1</text><text x="135" y="211" font-size="21" fill="#17324d">count = 1</text><text x="135" y="247" font-size="20" fill="#24734d">1 &lt; 4 → Да</text><text x="135" y="290" font-size="19" fill="#17324d">вывести 1</text><text x="135" y="321" font-size="19" fill="#17324d">count станет 2</text>
<rect x="245" y="130" width="180" height="220" rx="16" fill="#e4f5ec" stroke="#379669" stroke-width="3"/><text x="335" y="170" font-size="19" font-weight="700" fill="#194d35">Проверка 2</text><text x="335" y="211" font-size="21" fill="#17324d">count = 2</text><text x="335" y="247" font-size="20" fill="#24734d">2 &lt; 4 → Да</text><text x="335" y="290" font-size="19" fill="#17324d">вывести 2</text><text x="335" y="321" font-size="19" fill="#17324d">count станет 3</text>
<rect x="445" y="130" width="180" height="220" rx="16" fill="#e4f5ec" stroke="#379669" stroke-width="3"/><text x="535" y="170" font-size="19" font-weight="700" fill="#194d35">Проверка 3</text><text x="535" y="211" font-size="21" fill="#17324d">count = 3</text><text x="535" y="247" font-size="20" fill="#24734d">3 &lt; 4 → Да</text><text x="535" y="290" font-size="19" fill="#17324d">вывести 3</text><text x="535" y="321" font-size="19" fill="#17324d">count станет 4</text>
<rect x="645" y="130" width="180" height="220" rx="16" fill="#fbe9e7" stroke="#c85a50" stroke-width="3"/><text x="735" y="170" font-size="19" font-weight="700" fill="#6a2d28">Проверка 4</text><text x="735" y="211" font-size="21" fill="#17324d">count = 4</text><text x="735" y="247" font-size="20" fill="#bd4a3e">4 &lt; 4 → Нет</text><text x="735" y="290" font-size="19" fill="#17324d">тело пропустить</text><text x="735" y="321" font-size="19" fill="#17324d">выйти из цикла</text>
<rect x="845" y="130" width="190" height="220" rx="16" fill="#e4effa" stroke="#3977b8" stroke-width="3"/><text x="940" y="170" font-size="19" font-weight="700" fill="#17324d">После цикла</text><text x="940" y="225" font-size="19" fill="#17324d">программа</text><text x="940" y="255" font-size="19" fill="#17324d">продолжает</text><text x="940" y="285" font-size="19" fill="#17324d">работу</text>
</g>
<g stroke="#36556f" stroke-width="3" fill="none"><path d="M225 240 H241"/><path d="M425 240 H441"/><path d="M625 240 H641"/><path d="M825 240 H841"/></g>
<g fill="#36556f"><path d="M241 233 l10 7 -10 7z"/><path d="M441 233 l10 7 -10 7z"/><path d="M641 233 l10 7 -10 7z"/><path d="M841 233 l10 7 -10 7z"/></g>
<text x="540" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324d">На экран попадут числа: 1, 2, 3</text>
</svg>
