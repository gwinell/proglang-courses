<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="title desc">
<title id="title">Условие if внутри цикла while</title><desc id="desc">Программа получает первое число, проверяет условие while: число не равно нулю. Пока условие истинно, if определяет положительное ли число, выводится результат, запрашивается следующее число, затем проверка while повторяется. Ноль ведёт к выходу.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#36556f"/></marker></defs>
<rect width="1080" height="700" rx="20" fill="#f7fafc"/>
<text x="540" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d">if внутри while: числа вводятся до нуля</text>
<rect x="420" y="68" width="240" height="56" rx="15" fill="#e4effa" stroke="#3977b8" stroke-width="3"/><text x="540" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Получить первое число</text>
<path d="M540 124 V151" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M540 154 L675 224 L540 294 L405 224 Z" fill="#fff2cc" stroke="#c58c1c" stroke-width="3"/><text x="540" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4f3a08">число != 0?</text>
<path d="M405 224 H208 V300" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/><text x="285" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#bd4a3e">Нет: число равно 0</text>
<rect x="108" y="305" width="200" height="65" rx="14" fill="#fbe9e7" stroke="#c85a50" stroke-width="3"/><text x="208" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#6a2d28">Цикл завершён</text>
<path d="M675 224 H805 V264" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/><text x="732" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24734d">Да: тело цикла</text>
<path d="M805 268 L930 332 L805 396 L680 332 Z" fill="#fff2cc" stroke="#c58c1c" stroke-width="3"/><text x="805" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#4f3a08">число &gt; 0?</text>
<path d="M680 332 H620 V422" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/><text x="635" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#bd4a3e">Нет</text>
<rect x="520" y="427" width="200" height="58" rx="14" fill="#fbe9e7" stroke="#c85a50" stroke-width="3"/><text x="620" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#6a2d28">Вывести: отрицательное</text>
<path d="M930 332 H970 V422" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/><text x="950" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24734d">Да</text>
<rect x="870" y="427" width="190" height="58" rx="14" fill="#e4f5ec" stroke="#379669" stroke-width="3"/><text x="965" y="463" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#194d35">Вывести: положительное</text>
<path d="M620 485 V520 H540" fill="none" stroke="#36556f" stroke-width="4"/><path d="M965 485 V520 H540" fill="none" stroke="#36556f" stroke-width="4"/><path d="M540 520 V540" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="410" y="545" width="260" height="58" rx="14" fill="#e4effa" stroke="#3977b8" stroke-width="3"/><text x="540" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#17324d">Получить следующее число</text>
<path d="M410 574 H350 V224 H402" fill="none" stroke="#36556f" stroke-width="4" marker-end="url(#arrow)"/><text x="330" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#36556f" transform="rotate(-90 330 465)">вернуться к условию while</text>
</svg>
