<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
<title id="title">Четыре коллекции Python</title><desc id="desc">Список и кортеж упорядочены, словарь содержит пары ключ значение, множество убирает повторы.</desc>
<rect width="980" height="260" rx="20" fill="#f7f8fc"/><text x="32" y="45" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24324a">Выбирай коллекцию по задаче</text>
<g font-family="Arial,sans-serif"><rect x="30" y="70" width="220" height="155" rx="16" fill="#e8f0ff" stroke="#7192c7" stroke-width="2"/><text x="50" y="105" font-size="23" font-weight="700" fill="#244b83">list</text><text x="50" y="140" font-size="17" fill="#334155">порядок, можно менять</text><text x="50" y="175" font-size="17" fill="#334155">повторы разрешены</text>
<rect x="270" y="70" width="220" height="155" rx="16" fill="#eaf7ed" stroke="#6ea57b" stroke-width="2"/><text x="290" y="105" font-size="23" font-weight="700" fill="#28613a">tuple</text><text x="290" y="140" font-size="17" fill="#334155">порядок, нельзя менять</text><text x="290" y="175" font-size="17" fill="#334155">повторы разрешены</text>
<rect x="510" y="70" width="220" height="155" rx="16" fill="#fff3df" stroke="#d5a658" stroke-width="2"/><text x="530" y="105" font-size="23" font-weight="700" fill="#815418">dict</text><text x="530" y="140" font-size="17" fill="#334155">ключ ведёт к значению</text><text x="530" y="175" font-size="17" fill="#334155">ключи уникальны</text>
<rect x="750" y="70" width="200" height="155" rx="16" fill="#f2eaff" stroke="#9b7bc5" stroke-width="2"/><text x="770" y="105" font-size="23" font-weight="700" fill="#64408c">set</text><text x="770" y="140" font-size="17" fill="#334155">без порядка</text><text x="770" y="175" font-size="17" fill="#334155">только разные</text></g>
</svg>
