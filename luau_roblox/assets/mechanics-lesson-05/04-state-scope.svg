<rect x="48" y="150" width="535" height="360" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><rect x="615" y="150" width="537" height="360" rx="18" fill="white" stroke="#d96b19" stroke-width="2"/><text x="76" y="196" fill="#2563eb" font-size="29" font-weight="700" text-anchor="start">Состояние игрока</text><text x="644" y="196" fill="#d96b19" font-size="29" font-weight="700" text-anchor="start">Состояние предмета</text><rect x="76" y="230" width="475" height="115" rx="18" fill="#eff5ff" stroke="#bfd1f0" stroke-width="2"/><text x="94" y="265" fill="#17243d" font-size="23" font-weight="700" text-anchor="start">Игрок A</text><text x="94" y="302" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">coins = 5   •   stage = 1</text><text x="94" y="331" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">nextDamageAt = 2.0</text><rect x="76" y="365" width="475" height="115" rx="18" fill="#eff5ff" stroke="#bfd1f0" stroke-width="2"/><text x="94" y="400" fill="#17243d" font-size="23" font-weight="700" text-anchor="start">Игрок B</text><text x="94" y="437" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">coins = 0   •   stage = 0</text><text x="94" y="466" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">nextDamageAt = 0.0</text><rect x="644" y="230" width="478" height="115" rx="18" fill="#fff8ec" stroke="#e9d1a4" stroke-width="2"/><text x="665" y="270" fill="#17243d" font-size="25" font-weight="700" text-anchor="start">Coin1</text><text x="665" y="313" fill="#d96b19" font-size="25" font-weight="700" text-anchor="start">available = false</text><rect x="644" y="365" width="478" height="115" rx="18" fill="#fff8ec" stroke="#e9d1a4" stroke-width="2"/><text x="665" y="405" fill="#17243d" font-size="25" font-weight="700" text-anchor="start">Coin2</text><text x="665" y="448" fill="#0f8a68" font-size="25" font-weight="700" text-anchor="start">available = true</text><text x="48" y="560" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Урон: пауза одного игрока не блокирует другого.</text><text x="48" y="600" fill="#52627c" font-size="23" font-weight="400" text-anchor="start">Монета: после подбора предмет временно недоступен всем.</text>
