<style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f4f7fc}</style>
<rect width="1200" height="680" fill="#f4f7fc"/>
<text x="48" y="65" fill="#17243d" font-size="36" font-weight="700" text-anchor="start">Возвращение предметов в мир</text><text x="48" y="104" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Спрятать существующий объект и создать новый — разные жизненные циклы.</text>
<text x="48" y="155" fill="#2563eb" font-size="27" font-weight="700" text-anchor="start">Монета</text><rect x="48" y="175" width="246" height="140" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="64" y="224" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Есть Part</text><text x="64" y="272" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">available = true</text><path d="M299,245 L326,245" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="334" y="175" width="246" height="140" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="350" y="224" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Принять касание</text><text x="350" y="272" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">Coins + 5</text><path d="M585,245 L612,245" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="620" y="175" width="246" height="140" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="636" y="224" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Скрыть на 4 с</text><text x="636" y="272" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">available = false</text><path d="M871,245 L898,245" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="906" y="175" width="246" height="140" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="922" y="224" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Показать снова</text><text x="922" y="272" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">тот же объект</text><text x="48" y="375" fill="#0f8a68" font-size="27" font-weight="700" text-anchor="start">Аптечка</text><rect x="48" y="395" width="246" height="140" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="64" y="444" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Есть предмет</text><text x="64" y="492" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">здоровье &lt; Max</text><path d="M299,465 L326,465" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="334" y="395" width="246" height="140" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="350" y="444" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Восстановить</text><text x="350" y="492" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">до MaxHealth</text><path d="M585,465 L612,465" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="620" y="395" width="246" height="140" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="636" y="444" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Destroy + 6 с</text><text x="636" y="492" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">предмета нет</text><path d="M871,465 L898,465" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="906" y="395" width="246" height="140" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="922" y="444" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Создать снова</text><text x="922" y="492" fill="#52627c" font-size="20" font-weight="400" text-anchor="start">новый объект</text>
<text x="48" y="650" fill="#52627c" font-size="18" font-weight="400" text-anchor="start">Учебная схема • Roblox Studio • урок 5</text>
