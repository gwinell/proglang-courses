<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Контрольная точка принадлежит игроку">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f4f7fc}</style>
<rect width="1200" height="680" fill="#f4f7fc"/>
<text x="48" y="65" fill="#17243d" font-size="36" font-weight="700" text-anchor="start">Контрольная точка принадлежит игроку</text><text x="48" y="104" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Стрелки показывают ссылки, а не маршрут движения персонажа.</text>
<rect x="48" y="175" width="520" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="76" y="218" fill="#2563eb" font-size="28" font-weight="700" text-anchor="start">Игрок A</text><text x="76" y="261" fill="#17243d" font-size="25" font-weight="400" text-anchor="start">Stage = 2</text><text x="76" y="300" fill="#52627c" font-size="22" font-weight="400" text-anchor="start">RespawnLocation → Checkpoint2</text><rect x="785" y="175" width="367" height="150" rx="18" fill="#eff8f4" stroke="#0f8a68" stroke-width="2"/><text x="810" y="237" fill="#0f8a68" font-size="30" font-weight="700" text-anchor="start">Checkpoint2</text><text x="810" y="283" fill="#52627c" font-size="23" font-weight="400" text-anchor="start">SpawnLocation</text><path d="M582,250 L768,250" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="380" width="520" height="150" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="76" y="423" fill="#2563eb" font-size="28" font-weight="700" text-anchor="start">Игрок B</text><text x="76" y="466" fill="#17243d" font-size="25" font-weight="400" text-anchor="start">Stage = 1</text><text x="76" y="505" fill="#52627c" font-size="22" font-weight="400" text-anchor="start">RespawnLocation → Checkpoint1</text><rect x="785" y="380" width="367" height="150" rx="18" fill="#eff8f4" stroke="#0f8a68" stroke-width="2"/><text x="810" y="442" fill="#0f8a68" font-size="30" font-weight="700" text-anchor="start">Checkpoint1</text><text x="810" y="488" fill="#52627c" font-size="23" font-weight="400" text-anchor="start">SpawnLocation</text><path d="M582,455 L768,455" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="590" fill="#17243d" font-size="23" font-weight="700" text-anchor="start">Один мир, но место следующего появления у каждого своё.</text>
<text x="48" y="650" fill="#52627c" font-size="18" font-weight="400" text-anchor="start">Учебная схема • Roblox Studio • урок 5</text>
</svg>