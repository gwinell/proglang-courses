<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="От действия к обработчику">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f4f7fc}</style>
<rect width="1200" height="680" fill="#f4f7fc"/>
<text x="48" y="65" fill="#17243d" font-size="36" font-weight="700" text-anchor="start">От действия к обработчику</text><text x="48" y="104" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Событие передаёт аргументы. Обработчик читает их и меняет состояние мира.</text>
<rect x="48" y="190" width="246" height="185" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="70" y="228" fill="#2563eb" font-size="20" font-weight="700" text-anchor="start">01</text><text x="70" y="275" fill="#17243d" font-size="26" font-weight="700" text-anchor="start">Действие</text><text x="70" y="325" fill="#52627c" font-size="19" font-weight="400" text-anchor="start">Игрок нажимает E</text><path d="M299,282 L327,282" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="334" y="190" width="246" height="185" rx="18" fill="white" stroke="#7550cc" stroke-width="2"/><text x="356" y="228" fill="#7550cc" font-size="20" font-weight="700" text-anchor="start">02</text><text x="356" y="275" fill="#17243d" font-size="26" font-weight="700" text-anchor="start">Событие</text><text x="356" y="325" fill="#52627c" font-size="19" font-weight="400" text-anchor="start">Triggered(player)</text><path d="M585,282 L613,282" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="620" y="190" width="246" height="185" rx="18" fill="white" stroke="#d96b19" stroke-width="2"/><text x="642" y="228" fill="#d96b19" font-size="20" font-weight="700" text-anchor="start">03</text><text x="642" y="275" fill="#17243d" font-size="26" font-weight="700" text-anchor="start">Обработчик</text><text x="642" y="325" fill="#52627c" font-size="19" font-weight="400" text-anchor="start">onTriggered</text><path d="M871,282 L899,282" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="906" y="190" width="246" height="185" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="928" y="228" fill="#0f8a68" font-size="20" font-weight="700" text-anchor="start">04</text><text x="928" y="275" fill="#17243d" font-size="26" font-weight="700" text-anchor="start">Результат</text><text x="928" y="325" fill="#52627c" font-size="19" font-weight="400" text-anchor="start">Cube создан</text><rect x="48" y="420" width="1104" height="164" rx="18" fill="#eaf0ff" stroke="#b9cafa" stroke-width="2"/><text x="76" y="463" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Подключение выполняется один раз:</text><text x="76" y="507" fill="#2563eb" font-size="29" font-weight="700" text-anchor="start">prompt.Triggered:Connect(onTriggered)</text><text x="76" y="550" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Передаём функцию без (). Она выполнится позже, когда придёт событие.</text>
<text x="48" y="650" fill="#52627c" font-size="18" font-weight="400" text-anchor="start">Учебная схема • Luau / Roblox Studio • урок 4</text>
</svg>