<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Иерархия: дети и потомки">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f4f7fc}</style>
<rect width="1200" height="680" fill="#f4f7fc"/>
<text x="48" y="65" fill="#17243d" font-size="36" font-weight="700" text-anchor="start">Иерархия: дети и потомки</text><text x="48" y="104" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Стрелка идёт от родителя к дочернему объекту. Это не карта координат.</text>
<rect x="48" y="145" width="690" height="450" rx="18" fill="white" stroke="#d7e0ed" stroke-width="2"/><rect x="78" y="170" width="220" height="58" rx="12" fill="#f8fbff" stroke="#2563eb" stroke-width="2"/><text x="96" y="207" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Workspace</text><rect x="118" y="250" width="250" height="58" rx="12" fill="#f8fbff" stroke="#7550cc" stroke-width="2"/><text x="136" y="287" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Lesson04Control</text><rect x="168" y="350" width="220" height="58" rx="12" fill="#f8fbff" stroke="#2563eb" stroke-width="2"/><text x="186" y="387" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Control</text><rect x="208" y="450" width="260" height="58" rx="12" fill="#f8fbff" stroke="#d96b19" stroke-width="2"/><text x="226" y="487" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">ProximityPrompt</text><rect x="438" y="350" width="220" height="58" rx="12" fill="#f8fbff" stroke="#0f8a68" stroke-width="2"/><text x="456" y="387" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Cube</text><rect x="478" y="450" width="220" height="58" rx="12" fill="#f8fbff" stroke="#d96b19" stroke-width="2"/><text x="496" y="487" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">PointLight</text><path d="M120,228 L155,250" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M195,308 L220,350" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M335,308 L490,350" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M245,408 L260,450" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M555,408 L570,450" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="770" y="145" width="382" height="450" rx="18" fill="white" stroke="#d7e0ed" stroke-width="2"/><text x="794" y="190" fill="#17243d" font-size="25" font-weight="700" text-anchor="start">У каждого объекта</text><text x="794" y="223" fill="#17243d" font-size="25" font-weight="700" text-anchor="start">только один Parent</text><text x="794" y="275" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">Для Lesson04Control:</text><text x="794" y="314" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">Control и Cube — дети.</text><text x="794" y="353" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">Prompt и PointLight —</text><text x="794" y="392" fill="#17243d" font-size="22" font-weight="400" text-anchor="start">потомки, но не дети.</text><text x="794" y="431" fill="#17243d" font-size="22" font-weight="400" text-anchor="start"></text><text x="794" y="470" fill="#2563eb" font-size="22" font-weight="400" text-anchor="start">GetChildren(): 2</text><text x="794" y="509" fill="#2563eb" font-size="22" font-weight="400" text-anchor="start">GetDescendants(): 4</text>
<text x="48" y="650" fill="#52627c" font-size="18" font-weight="400" text-anchor="start">Учебная схема • Luau / Roblox Studio • урок 4</text>
</svg>