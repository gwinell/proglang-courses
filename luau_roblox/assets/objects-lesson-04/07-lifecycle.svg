<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Жизненный цикл объекта">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}svg{background:#f4f7fc}</style>
<rect width="1200" height="680" fill="#f4f7fc"/>
<text x="48" y="65" fill="#17243d" font-size="36" font-weight="700" text-anchor="start">Жизненный цикл объекта</text><text x="48" y="104" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Создание, появление в дереве и уничтожение — разные действия.</text>
<rect x="48" y="175" width="340" height="270" rx="18" fill="white" stroke="#2563eb" stroke-width="2"/><text x="70" y="221" fill="#2563eb" font-size="27" font-weight="700" text-anchor="start">1. Создать</text><text x="70" y="278" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">Instance.new(&quot;Part&quot;)</text><text x="70" y="334" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Объект есть в переменной.</text><text x="70" y="372" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Parent пока равен nil.</text><rect x="430" y="175" width="340" height="270" rx="18" fill="white" stroke="#0f8a68" stroke-width="2"/><text x="452" y="221" fill="#0f8a68" font-size="27" font-weight="700" text-anchor="start">2. Добавить в мир</text><text x="452" y="278" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">part.Parent = folder</text><text x="452" y="334" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Сначала задать свойства.</text><text x="452" y="372" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Затем назначить Parent.</text><rect x="812" y="175" width="340" height="270" rx="18" fill="white" stroke="#d96b19" stroke-width="2"/><text x="834" y="221" fill="#d96b19" font-size="27" font-weight="700" text-anchor="start">3. Уничтожить</text><text x="834" y="278" fill="#17243d" font-size="21" font-weight="700" text-anchor="start">part:Destroy()</text><text x="834" y="334" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Удаляются и потомки.</text><text x="834" y="372" fill="#17243d" font-size="21" font-weight="400" text-anchor="start">Объект нельзя вернуть.</text><path d="M392,307 L421,307" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><path d="M774,307 L803,307" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="482" width="1104" height="110" rx="18" fill="#fff5e9" stroke="#efcba6" stroke-width="2"/><text x="72" y="525" fill="#17243d" font-size="24" font-weight="700" text-anchor="start">Parent = nil — временно убрать из дерева, сохранив ссылку.</text><text x="72" y="563" fill="#52627c" font-size="21" font-weight="400" text-anchor="start">Destroy() — завершить жизнь объекта. После этого переменную лучше обнулить.</text>
<text x="48" y="650" fill="#52627c" font-size="18" font-weight="400" text-anchor="start">Учебная схема • Luau / Roblox Studio • урок 4</text>
</svg>